<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 主背景渐变：深邃紫靛蓝到炫彩青绿 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <!-- 玻璃高光渐变 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.0" />
    </linearGradient>

    <!-- 霓虹发光滤镜 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 (iOS 默认裁切标准) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 玻璃拟态的上半部分高光 -->
  <path d="M0,112 C0,50.16 50.16,0 112,0 H400 C461.84,0 512,50.16 512,112 V256 C512,256 360,280 256,280 C152,280 0,256 0,256 Z" fill="url(#glassGrad)" />

  <!-- 核心图案组：公文包 + AI 星芒 -->
  <g transform="translate(0, 15)">
    <!-- 公文包主体轮廓 -->
    <rect x="136" y="190" width="240" height="170" rx="28" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round" />
    
    <!-- 公文包提手 -->
    <path d="M200,190 V145 C200,131.2 211.2,120 225,120 H287 C300.8,120 312,131.2 312,145 V190" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- AI 智慧火花/星芒 (位于公文包中央偏上) -->
    <path d="M256,235 L267,212 L290,201 L267,190 L256,167 L245,190 L222,201 L245,212 Z" fill="#00FFFF" filter="url(#neonGlow)" />
    
    <!-- 智能节点/网络线条 (象征投递和匹配) -->
    <circle cx="206" cy="275" r="12" fill="#FFFFFF" />
    <line x1="218" y1="275" x2="306" y2="275" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    
    <circle cx="306" cy="275" r="12" fill="#FFFFFF" />
    <line x1="206" y1="315" x2="276" y2="315" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    
    <!-- 对勾 (象征成功投递) -->
    <path d="M296,305 L306,315 L326,295" fill="none" stroke="#00FF87" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  </g>
</svg>
